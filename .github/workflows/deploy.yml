name: CI / Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint source code
        # 只检查改动的源码文件，跳过 content/ 文章和存量有 lint 问题的文件
        run: eslint 'app/**/*.{ts,vue}' 'server/**/*.ts' 'nuxt.config.ts' 'blog.config.ts' 'content.config.ts' --ignore-pattern 'app/app.config.ts' --ignore-pattern 'app/feeds.ts'

      - name: Generate static site
        run: pnpm generate

      # 仅 main 分支推送到 gh-pages 分支（服务器从 gh-pages 分支拉取静态产物）
      - name: Deploy to gh-pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: gh-pages
